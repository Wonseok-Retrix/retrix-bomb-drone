# ============================================================
#  Object Tracking Drone - 설정 기본값
#  설치 시 config.yaml 로 복사됩니다. 실제 튜닝은 config.yaml 에서 하세요.
# ============================================================

camera:
  # AI 카메라에 올릴 모델 (.rpk)
  # 기본 제공 모델: /usr/share/imx500-models/ 안에 있음
  # 직접 학습한 모델: ~/models/network.rpk 처럼 경로를 바꿔주세요
  model: /usr/share/imx500-models/imx500_network_ssd_mobilenetv2_fpnlite_320x320_pp.rpk

  # 라벨 파일. 기본 모델이면 assets/coco_labels.txt
  # 직접 학습한 모델이면 Colab에서 받은 labels.txt
  labels: assets/coco_labels.txt

  # 카메라 장착 방향. 영상과 검출 좌표를 함께 180도 돌립니다.
  # 정방향으로 장착했다면 0으로 바꾸세요. 지원값: 0, 180
  rotation: 180

  # 추론 프레임레이트.
  # ★ 현재 이 하드웨어는 실측 1~2 fps 밖에 나오지 않습니다 ★
  #   이 값을 올려도 실제로 빨라지지 않으므로, 나머지 설정(control/tracking/release)은
  #   전부 "1~2 fps 라고 가정하고" 보수적으로 잡아두었습니다.
  #   나중에 카메라가 빨라지면 이 값과 함께 stale_stop / lost_timeout 을 줄이세요.
  # ※ 이 값은 MAVLink 전송 주기와 무관합니다. 명령은 항상 send_rate 로 나갑니다.
  fps: 2

  # 이 시간(초) 동안 프레임이 아예 안 들어오면 카메라가 죽은 것으로 보고 정지합니다.
  # 목표가 조금 오래된 것과는 다릅니다 (그건 control.stale_* 가 처리).
  # 1 fps 여도 여유가 있도록 넉넉히 잡습니다.
  stall_timeout: 4.0

  # picamera2 자체 미리보기 창. Lite 이미지에는 데스크톱이 없으므로 false 로 둡니다.
  # 화면은 tools/preview.py 를 실행하고 브라우저로 봅니다 (http://drone.local:8080)
  preview: false


detection:
  # 쫓아갈 물체의 라벨 이름. 라벨 파일에 있는 이름과 정확히 같아야 함
  # 예: person, sports ball, bottle ...
  target_class: person

  # 확신도 임계값 (0.0 ~ 1.0)
  # 낮추면 잘 찾지만 오검출↑ / 높이면 정확하지만 자주 놓침
  threshold: 0.50

  # 겹친 박스를 합치는 기준. 보통 그대로 두면 됨
  iou: 0.65

  # 한 프레임에서 최대 몇 개까지 볼지
  max_detections: 10

  # ---- 모델마다 다른 출력 형식. 아래 표대로만 맞춰주면 됩니다 ----
  #  ssd_mobilenetv2 / efficientdet : normalization=false, order=yx, postprocess=""
  #  yolo11n_pp / yolov8n_pp        : normalization=true,  order=xy, postprocess=""
  #  nanodet_plus (pp 없는 것)      : normalization=false, order=yx, postprocess="nanodet"
  #  Colab에서 직접 학습한 YOLO     : normalization=true,  order=xy, postprocess=""
  bbox_normalization: false
  bbox_order: yx
  postprocess: ""


tracking:
  # 박스 위치를 얼마나 부드럽게 만들지 (0.0 ~ 1.0)
  # 0에 가까울수록 부드럽지만 느림 / 1에 가까울수록 민감하지만 떨림
  # 1~2 fps 에서는 평활화가 그대로 '지연'이 됩니다. 프레임이 귀하므로 높게 잡습니다.
  smoothing: 0.8

  # 이 시간(초) 동안 목표를 못 보면 "놓쳤다"고 판단하고 정지
  # 1 fps 면 한 장 걸러 못 봐도 2초입니다. 짧게 잡으면 계속 놓쳤다고 나옵니다.
  lost_timeout: 3.0

  # 여러 개가 보일 때 목표 선택 기준
  #   confidence : 가장 확신도가 높은 것
  #   largest    : 가장 큰 것 (= 가장 가까운 것)
  #   nearest    : 직전 목표와 가장 가까운 것 (추천)
  select: nearest


# ============================================================
#  제어 (하방 카메라로 과녁 따라가기)  ->  src/controller.py
#    좌우 오차 -> 좌우 이동 / 상하 오차 -> 전후 이동 / 크기 오차 -> 고도
#    기수는 돌리지 않습니다. 카메라 위쪽이 기수 방향을 향하도록 다세요.
# ============================================================
control:
  # P 제어의 강도와 OBC 명령 상한을 max_* 값으로 조절합니다.
  # 키우면 빠르지만 흔들림(진동)이 생길 수 있습니다.
  # 하방은 기체가 조금만 기울어도 화면이 크게 밀리므로 낮게 잡는 것이 안전합니다.
  # ★ 카메라가 1~2 fps 라서 피드백이 최대 1초 늦게 옵니다.
  #   느린 피드백에 큰 속도를 물리면 좌우로 크게 흔들립니다(헌팅).

  # 오차가 클수록 이 값에 가까워지며, 절대 이 값을 넘지 않습니다. AltHold의
  # 실제 속도는 기체 튜닝과 환경에 따라 달라지므로 m/s를 뜻하지 않습니다.
  max_lateral: 0.4
  max_forward: 0.4
  max_vertical: 0.25

  # ---- 느린 카메라 대응: 오래된 정보일수록 명령을 약하게 ----
  # 프레임 사이(최대 1초)에는 새 정보가 없습니다. 그동안 같은 속도로 계속 밀면
  # 목표를 지나쳐버립니다. 그래서 나이에 따라 명령을 줄여 스스로 멈추게 합니다.
  #
  #   나이 <= stale_hold          : 명령 그대로 (방금 본 정보)
  #   stale_hold ~ stale_stop     : 선형으로 감소
  #   나이 >= stale_stop          : 완전 정지
  #
  # 결과: "한 장 보고 -> 조금 움직이고 -> 멈춰서 다음 장 기다리기"
  # 카메라가 빨라지면 두 값을 같이 줄이세요 (예: 10 fps 면 0.15 / 0.4)
  stale_hold: 0.3      # 초
  stale_stop: 1.2      # 초

  # 무시할 오차. 화면 중심에서 이만큼 안쪽이면 가만히 있음 (미세 떨림 방지)
  deadband: 0.08       # 화면 절반 기준 비율 (0.08 = 8%)

  # 유지할 고도. 화면 높이 대비 과녁 박스 높이가 이 값이 되도록 오르내림
  # ※ 이 값을 키우면 드론이 더 낮게 내려옵니다. 한 번에 0.05 씩만 올리세요
  target_size: 0.35
  size_deadband: 0.05


# ============================================================
#  서보 드로퍼 (과녁에 물건 떨어뜨리기)
#  서보는 FC 를 거치지 않고 라즈베리파이 GPIO 가 직접 제어합니다.
#  (FC 서보 레일에서는 5V 전원만 받습니다. 접지는 반드시 Pi 와 공통으로)
# ============================================================
dropper:
  pin: 18              # 신호선을 연결한 GPIO 번호 (BCM). GPIO18 = 물리핀 12

  # 서보 자세 두 개. tools/check_dropper.py 로 찾아서 적으세요
  closed_angle: 0      # 물건을 잡고 있는 각도
  open_angle: 80       # 물건을 놓는 각도

  open_seconds: 1.5    # 이 시간 동안 열어뒀다가 스스로 닫힙니다
  # 서보마다 펄스 폭이 다릅니다. 각도가 안 맞으면 이 값을 조절하세요
  min_pulse_us: 500
  max_pulse_us: 2500

  # ---- 언제 놓을지 (src/release.py) ----
  release:
    # 시동 및 비행 모드와 무관하게 CH8 override 허용 스위치가 HIGH일 때
    # 아래 영상 조건을 만족하면 투하합니다. 지상에서는 CH8을 LOW로 두세요.

    # 과녁 중심이 화면 중앙에서 이만큼 안쪽이어야 함 (0.10 = 화면 절반의 10%)
    # 작을수록 정확하지만 조건을 못 맞춰 계속 못 놓을 수 있습니다
    align: 0.10

    # 박스가 이 크기 이상이어야 함 = 충분히 낮게 내려왔다는 뜻
    size_min: 0.30

    # 위 조건이 이 시간(초) 동안 계속 유지되어야 놓습니다.
    # 지나가다 우연히 중앙에 걸린 순간에 놓지 않기 위한 장치입니다
    # 1~2 fps 에서는 이 시간 동안 프레임이 2~4장뿐입니다. 너무 짧게 잡지 마세요.
    hold_seconds: 2.0

    # 과녁 정보가 이보다 오래됐으면 조건을 깹니다 (hold 타이머도 0으로).
    # 메인 루프는 10Hz 인데 카메라는 1~2 fps 라서, 이게 없으면 옛날 한 장으로
    # hold 타이머가 끝까지 차버립니다. 카메라 주기보다 조금 길게 잡으세요.
    max_age: 1.5

    # 드로퍼가 카메라 바로 밑에 없을 때 조준점 보정 (기본 0 = 화면 정중앙)
    # 드로퍼가 카메라보다 뒤에 있으면 aim_y 를 음수로 (과녁을 화면 위쪽에 두고 투하)
    aim_x: 0.0
    aim_y: 0.0


mavlink:
  # Pi <-> 비행 컨트롤러 연결
  # UART 직결: /dev/serial0  (GPIO 14/15. install.sh 가 여기에 PL011 을 붙여줍니다)
  # USB 연결:  /dev/ttyACM0
  # SITL 시뮬: udpin:127.0.0.1:14550
  connection: /dev/serial0
  baud: 57600

  # RC override 송신 SYSID는 FC의 MAV_GCS_SYSID와 반드시 같아야 합니다.
  # Mission Planner MAVLink Inspector: FC=1/1, OBC=255/191
  source_system: 255
  source_component: 191

  # GCS에 OBC 추적 상태를 STATUSTEXT(INFO)로 보내는 주기(초)
  status_interval: 5

  # ArduCopter RC override 전송 주기 (Hz).
  # RC_OVERRIDE_TIME 안에 새 명령이 없으면 실제 수신기 입력으로 돌아갑니다.
  # 지연과 패킷 유실을 고려해 최소 5, 권장 10 이상을 유지하세요.
  # ※ 카메라 fps 와 무관합니다. 카메라가 1 fps 여도 명령은 10Hz 로 계속 나갑니다.
  send_rate: 10

  rc_override:
    # 기본 ArduCopter 채널 매핑. RCMAP_*를 바꿨다면 함께 맞추세요.
    roll_channel: 1
    pitch_channel: 2
    throttle_channel: 3
    yaw_channel: 4

    # 이 채널을 Mission Planner에서 RCx_OPTION=46(RC Override Enable)으로
    # 지정합니다. HIGH일 때만 OBC 제어를 허용합니다. override 중 RC1~RC4
    # 스틱은 무시되므로 수동 복귀 시 이 스위치를 반드시 LOW로 내리세요.
    enable_channel: 8
    enable_pwm_min: 1800

    # 조종기 캘리브레이션의 RCx_TRIM과 일치시킵니다.
    roll_trim: 1500
    pitch_trim: 1500
    throttle_trim: 1500
    yaw_trim: 1500

    # FC의 RC_CHANNELS 메시지가 이 시간보다 오래되면 override를 시작하지 않습니다.
    input_timeout: 0.5

    # 명령 단위당 PWM 변환 게인. 기본값에서는 수평 0.4, 수직 0.25 명령이
    # 각각 100us가 됩니다. pwm_span은 어떤 설정에서도 넘지 않는 안전 상한입니다.
    roll_pwm_per_unit: 250
    pitch_pwm_per_unit: 250
    throttle_pwm_per_unit: 400
    yaw_pwm_per_unit: 3

    # 최초 비행은 60부터 시작하고 기체 반응을 보며 조금씩 올리세요.
    pwm_span: 100
    pwm_min: 1100
    pwm_max: 1900

    # +오른쪽=roll PWM 증가, +전진=pitch PWM 감소, +하강=throttle PWM 감소.
    # 기체가 반대로 움직이면 해당 축만 1/-1로 바꾸세요.
    roll_sign: 1
    pitch_sign: -1
    throttle_sign: -1
    yaw_sign: 1

safety:
  # 시동(arm)이 걸려있을 때만 명령을 보냄
  require_armed: true
